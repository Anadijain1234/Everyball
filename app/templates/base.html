<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Everyball{% endblock %}</title>
<meta name="description" content="Every Test since 1877 and every ODI since 1971, ball by ball wherever it exists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b8321c'/%3E%3Cpath d='M11 4c4 8 4 16 0 24M21 4c-4 8-4 16 0 24' stroke='white' stroke-width='1.6' stroke-dasharray='2 2' fill='none'/%3E%3C/svg%3E">
<script>
  try { const t = localStorage.getItem("eb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body data-page="{{ page }}">
<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="ballmark"></span>everyball</a>
    <nav class="main">
      <a href="/duel" class="{{ 'on' if page == 'duel' }}">Duels</a>
      <a href="/ask" class="{{ 'on' if page == 'ask' }}">Ask</a>
      <a href="/#coverage">Coverage</a>
      <a href="/credits" class="{{ 'on' if page == 'credits' }}">Credits</a>
    </nav>
    <span class="spacer"></span>
    <div class="ac search"><input type="text" id="topsearch" placeholder="Find a player…" autocomplete="off" aria-label="Find a player"></div>
    <button class="iconbtn" id="theme" title="Light / dark" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    <button class="iconbtn menubtn" id="menubtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<main>
  <div class="wrap">
  {% block content %}
    <div class="empty"><h2>{{ message or "Something went wrong." }}</h2><p><a href="/">Back to the start</a></p></div>
  {% endblock %}
  </div>
</main>
<footer><div class="wrap">Everyball · men's Tests and ODIs · <a href="/credits">where the numbers come from</a></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
